name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject placeholder metadata
        shell: bash
        run: |
          if grep -q "YOUR_" pyproject.toml; then
            echo "Replace the GitHub username and Comfy publisher placeholders first."
            exit 1
          fi
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
